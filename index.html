<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초원 섬 · 링커 놀이터</title>
<meta name="description" content="세모네모의 링커들과 초원 섬에서 노는 작은 놀이터. 나비, 모자, 공, 우산, 비구름, 미끄럼틀, 그네, 시소를 꺼내 주세요.">
<meta property="og:title" content="초원 섬 · 링커 놀이터">
<meta property="og:description" content="세모네모의 링커들과 초원 섬에서 노는 작은 놀이터.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://seongyooo.github.io/linker-meadow/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#5596D6">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink: #242A4A; --ink-2: #4A4F6E; --gold: #FFDB80; --gold-ink: #A8681F; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    /* Chapter 7's sky (sampled from the game): deep blue overhead, the sun's warm haze low on one side, the clouds'
       blue-grey under it all. */
    background:
      radial-gradient(60% 34% at 12% 54%, rgba(255, 236, 196, .75), rgba(255, 236, 196, 0) 70%),
      linear-gradient(180deg, #0567C0 0%, #4A88CC 15%, #96B2CD 30%, #D3D1C3 45%, #EAE1C8 55%, #DCD6C5 65%, #C3C7C6 78%, #ADB7C3 90%, #A4AEC0 100%);
    color: var(--ink); font: 500 15px/1.4 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* The stage and how far it is, at the top. */
  .head { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none;
    color: #fff; text-shadow: 0 1px 10px rgba(36, 42, 74, .35); }
  .head small { display: block; font: 400 12px/1 "Tenor Sans", Georgia, serif; letter-spacing: .3em; opacity: .9; }
  .head b { display: block; font: 400 clamp(28px, 4.6vw, 40px)/1.15 "Tenor Sans", Georgia, serif; letter-spacing: .06em; margin-top: 6px; }
  .head span { display: block; font-size: 14px; margin-top: 4px; }

  /* Each core's count, in the core's middle. */
  .core-count { position: absolute; left: 0; top: 0; pointer-events: none; font: 400 22px/1 "Tenor Sans", Georgia, serif;
    color: #fff; letter-spacing: .04em; text-shadow: 0 0 8px rgba(168, 104, 31, .9), 0 1px 3px rgba(36, 42, 74, .5); white-space: nowrap; }
  .core-count.full { color: #FFF4D6; text-shadow: 0 0 14px rgba(255, 200, 90, 1), 0 1px 3px rgba(36, 42, 74, .5); }

  /* A cue for the hands, at the foot: a small picture of the mouse (or a finger) and a line. */
  .cue { position: fixed; left: 50%; bottom: max(26px, 6vh); transform: translate(-50%, 8px); display: flex; align-items: center; gap: 12px;
    padding: 10px 18px 10px 12px; border-radius: 22px; background: rgba(251, 248, 241, .94); box-shadow: 0 12px 30px -16px rgba(36, 42, 74, .6);
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .45s ease, transform .45s ease; }
  .cue.on { opacity: 1; transform: translate(-50%, 0); }
  .cue svg { width: 34px; height: 34px; flex: none; }
  .cue .body { fill: #fff; stroke: var(--ink); stroke-width: 1.6; }
  .cue .btn { fill: none; }
  .cue .lit { fill: var(--gold); animation: lit 1.2s ease-in-out infinite; }
  .cue .move { fill: none; stroke: var(--gold-ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: move 1.4s ease-in-out infinite; }
  @keyframes lit { 50% { opacity: .35; } }
  @keyframes move { 0% { transform: translateX(-3px); opacity: .3; } 60% { transform: translateX(3px); opacity: 1; } 100% { transform: translateX(3px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cue .lit, .cue .move { animation: none; } }

  .done { position: fixed; left: 50%; bottom: max(26px, 6vh); transform: translate(-50%, 10px); display: flex; gap: 12px; align-items: center;
    padding: 10px 12px 10px 18px; border-radius: 22px; background: rgba(251, 248, 241, .96); box-shadow: 0 14px 34px -16px rgba(36, 42, 74, .6);
    opacity: 0; pointer-events: none; transition: opacity .5s ease, transform .5s ease; white-space: nowrap; }
  .done.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .done button { font: inherit; color: #fff; background: var(--ink); border: 0; border-radius: 16px; padding: 7px 16px; cursor: pointer; }
  .done button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  body.og .head, body.og .cue, body.og .core-count, body.og .tray, body.og .modes { display: none; }

  /* The two ways to play, at the top left: sorting by stages, or the playground. */
  .modes { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); z-index: 5; display: flex; padding: 3px;
    border-radius: 18px; background: rgba(251, 248, 241, .82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px -14px rgba(36, 42, 74, .5); }
  .modes a { padding: 6px 13px; border-radius: 15px; color: var(--ink); text-decoration: none; font-size: 13px; }
  .modes a[aria-current="page"] { background: var(--ink); color: #fff; }
  .modes a:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  @media (max-width: 600px) { .head { top: calc(max(14px, env(safe-area-inset-top)) + 44px); } }

  /* The playground's tray: each tool drawn small with its name; drag one out onto the meadow (a press alone, or
     Enter, drops it somewhere on the island). */
  .tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 4;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 6px; width: max-content; max-width: calc(100vw - 150px);
    border-radius: 22px; background: rgba(251, 248, 241, .9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 12px 30px -16px rgba(36, 42, 74, .6); }
  .tray[hidden] { display: none; }
  .tray button { flex: none; width: 58px; padding: 6px 2px 5px; border: 0; border-radius: 16px; background: transparent; color: var(--ink);
    font: 500 11px/1.2 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; cursor: grab; display: grid; justify-items: center; gap: 3px; touch-action: none; }
  .tray button:hover { background: rgba(36, 42, 74, .07); }
  .tray button:active { cursor: grabbing; }
  .tray button:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .tray button:disabled { opacity: .35; cursor: default; }
  .tray svg { width: 32px; height: 32px; }
  @media (max-width: 600px) {
    .tray { left: 10px; transform: none; max-width: calc(100vw - 76px); justify-content: flex-start; padding: 4px; }
    .tray button { width: 46px; font-size: 10px; padding: 5px 0 4px; }
    .tray svg { width: 28px; height: 28px; }
    .cue { white-space: normal; width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; }
  }
  body.play .cue { top: calc(max(16px, env(safe-area-inset-top)) + 84px); bottom: auto; }
  body.play .head span { display: none; }
  /* The music (SEMONEMO's main theme), on from the first touch unless turned off; the button at the foot's right. */
  .sound { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(36, 42, 74, .18); background: rgba(251, 248, 241, .85);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--ink); cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 8px 24px -12px rgba(36, 42, 74, .5); }
  .sound svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .sound .on { display: none; }
  .sound[aria-pressed="true"] .on { display: inline; }
  .sound[aria-pressed="true"] .off { display: none; }
  .sound:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"></div>
<nav class="modes" aria-label="놀이 방법"><a href="./" id="modePlay">놀이터</a><a href="./?level=1" id="modeSort">나누기</a></nav>
<div class="head"><small id="stageNo">STAGE 1</small><b id="count">0 / 2</b><span id="hint"></span></div>
<div class="cue" id="cue" role="status"><svg id="cuePic" viewBox="0 0 34 34" aria-hidden="true"></svg><span id="cueText"></span></div>
<div class="done" id="done" role="status"><span id="doneText"></span><button type="button" id="next">다음 단계</button></div>
<nav class="tray" id="tray" aria-label="도구" hidden>
  <button type="button" data-tool="linker" aria-label="링커 더하기"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4.5c4.6 0 8 3.4 8 8v3.2c0 .8-.5 1.3-1.3 1.3H9.3c-.8 0-1.3-.5-1.3-1.3v-3.2c0-4.6 3.4-8 8-8z" fill="#3E4A7A"/><ellipse cx="16" cy="13.2" rx="4.6" ry="3.6" fill="#F6E3D4"/><circle cx="14.2" cy="13.3" r=".9" fill="#242A4A"/><circle cx="17.8" cy="13.3" r=".9" fill="#242A4A"/><path d="M9.5 17h13l1.8 9.5c.1.8-.4 1.5-1.2 1.5H8.9c-.8 0-1.3-.7-1.2-1.5z" fill="#55639A"/><path d="M14.4 22.5h3.2L16 19.8z" fill="#FFDB80"/></svg>링커</button>
  <button type="button" data-tool="butterfly"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 16c-2-5-7-8-10-6.5S5 17 9 18c-3 2-2 6 1 6s5-4 6-8z" fill="#F6D365"/><path d="M16 16c2-5 7-8 10-6.5S27 17 23 18c3 2 2 6-1 6s-5-4-6-8z" fill="#F29E4C"/><path d="M16 11v12" stroke="#4A3B5C" stroke-width="1.6" stroke-linecap="round"/></svg>나비</button>
  <button type="button" data-tool="hat"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="21" rx="12" ry="4" fill="#E9C77B"/><path d="M9.5 20.5c0-6 3-9 6.5-9s6.5 3 6.5 9z" fill="#F0D597"/><path d="M9.8 18h12.4v2.4H9.8z" fill="#E46F5A"/></svg>모자</button>
  <button type="button" data-tool="ball"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="#FFF6E0"/><path d="M16 16V6a10 10 0 0 1 8.66 5z" fill="#E8574A"/><path d="M16 16l8.66 5A10 10 0 0 1 16 26z" fill="#F4C542"/><path d="M16 16l-8.66 5a10 10 0 0 1 0-10z" fill="#4C8FD9"/><circle cx="16" cy="16" r="10" fill="none" stroke="#242A4A" stroke-opacity=".2"/></svg>공</button>
  <button type="button" data-tool="umbrella"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16a12 9 0 0 1 24 0q-2-1.8-4 0q-2-1.8-4 0q-2-1.8-4 0q-2-1.8-4 0q-2-1.8-4 0q-2-1.8-4 0z" fill="#F7A6C0"/><path d="M16 16v9a2.2 2.2 0 0 1-4.4 0" stroke="#6B4E3D" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M16 7V5" stroke="#6B4E3D" stroke-width="1.6" stroke-linecap="round"/></svg>우산</button>
  <button type="button" data-tool="rain"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 18.5a4.5 4.5 0 0 1 .8-8.9 6 6 0 0 1 11.5-.6A4.8 4.8 0 1 1 22.5 18.5z" fill="#fff" stroke="#9FB5D6" stroke-width="1.3"/><path d="M11.5 22l-1 3M16.5 22l-1 3M21.5 22l-1 3" stroke="#6FA8DC" stroke-width="1.6" stroke-linecap="round"/></svg>비구름</button>
  <button type="button" data-tool="slide"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27V9M10 27V9M5 13.5h5M5 18.5h5M5 23.5h5" stroke="#6FA8DC" stroke-width="1.8" stroke-linecap="round"/><path d="M10 9c5 0 6 4 9 10s5 7 9 7" stroke="#F2B33D" stroke-width="3.2" stroke-linecap="round" fill="none"/></svg>미끄럼틀</button>
  <button type="button" data-tool="swing"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27L9 6M27 27L23 6M7 6h18" stroke="#E46F5A" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M13 6v14M19 6v14" stroke="#9AA3B5" stroke-width="1.2"/><rect x="11.5" y="19.5" width="9" height="2.6" rx="1.2" fill="#C98A5B"/></svg>그네</button>
  <button type="button" data-tool="seesaw"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3.5 13l25 6.5" stroke="#F2B33D" stroke-width="3" stroke-linecap="round"/><path d="M12.5 27l3.5-10 3.5 10z" fill="#7FB77E"/></svg>시소</button>
</nav>
<button type="button" class="sound" id="sound" aria-pressed="false" aria-label="음악 켜기">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="on"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></g><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<audio id="music" src="assets/audio/title.m4a" loop preload="auto"></audio>
<script>
  // The music: SEMONEMO's main theme (the title's and the hub's), faded in at the first touch of the page (browsers allow sound only after one), unless the
  // reader turned it off before (remembered); the button turns it on and off; quiet while the tab is hidden.
  (() => {
    const music = document.getElementById('music'), button = document.getElementById('sound');
    let off = false;
    try { off = localStorage.getItem('linker-meadow.musicOff') === '1'; } catch (e) { /* none */ }
    let fade = 0;
    const show = (on) => { button.setAttribute('aria-pressed', on ? 'true' : 'false'); button.setAttribute('aria-label', on ? '음악 끄기' : '음악 켜기'); };
    const play = () => {
      music.volume = 0;
      music.play().then(() => {
        show(true);
        cancelAnimationFrame(fade);
        const t0 = performance.now();
        const step = () => { music.volume = Math.min(0.55, (performance.now() - t0) / 2500 * 0.55); if (music.volume < 0.55) fade = requestAnimationFrame(step); };
        fade = requestAnimationFrame(step);
      }).catch(() => show(false));
    };
    const stop = () => { cancelAnimationFrame(fade); music.pause(); show(false); };
    const first = (e) => {
      if (e.target.closest && e.target.closest('#sound')) return;   // (the button's own click decides)
      removeEventListener('pointerdown', first, true);
      if (!off && music.paused) play();
    };
    addEventListener('pointerdown', first, true);
    button.addEventListener('click', () => {
      removeEventListener('pointerdown', first, true);
      off = !music.paused;
      try { localStorage.setItem('linker-meadow.musicOff', off ? '1' : '0'); } catch (e) { /* none */ }
      off ? stop() : play();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) music.pause();
      else if (!off && button.getAttribute('aria-pressed') === 'true') music.play().catch(() => {});
    });
  })();
</script>
<script type="module">
  import { start } from './js/meadow3d.js?v=9';
  const $ = (id) => document.getElementById(id);
  // (#og: the picture for a link's preview, without the words.)
  if (location.hash === '#og') document.body.classList.add('og');
  const touch = matchMedia('(pointer: coarse)').matches;

  // The pictures: a mouse with its left or right button lit, and an arrow for a drag or a flick; or a finger.
  const mouse = (which, arrow) => `
    <rect class="body" x="9" y="5" width="16" height="24" rx="8"/>
    <path class="btn" d="M17 5v9M9 14h16" stroke="#242A4A" stroke-width="1.6"/>
    ${which ? `<path class="lit" d="${which === 'left' ? 'M17 5.8a7.2 7.2 0 0 0-7.2 7.2v.2h7.2z' : 'M17 5.8a7.2 7.2 0 0 1 7.2 7.2v.2h-7.2z'}"/>` : ''}
    ${which === 'wheel' ? '<rect class="lit" x="15.6" y="8" width="2.8" height="5" rx="1.4"/>' : ''}
    ${arrow === 'drag' ? '<path class="move" d="M26 22h6m-2-2 2 2-2 2"/>' : ''}
    ${arrow === 'flick' ? '<path class="move" d="M25 24c3-1 5-4 6-8m-3 0 3 0 0 3"/>' : ''}`;
  const finger = (arrow) => `
    <path class="body" d="M14 30v-9l-3-3c-1-1 0-3 2-2l2 2V7a2 2 0 0 1 4 0v8l6 1c1.5.3 2 1.4 1.8 2.6L25 30z"/>
    ${arrow === 'drag' ? '<path class="move" d="M27 8h5m-2-2 2 2-2 2"/>' : ''}
    ${arrow === 'flick' ? '<path class="move" d="M26 12c3-1 5-3 6-7m-3 0 3 0 0 3"/>' : ''}
    ${arrow === 'pinch' ? '<path class="move" d="M4 6l4 4M32 6l-4 4"/>' : ''}`;

  // What each stage teaches, cue by cue: each shown until it is done.
  const CUES = {
    grab: { pic: touch ? finger('drag') : mouse('left', 'drag'), text: touch ? '링커를 손가락으로 집어 끌어 보세요' : '왼쪽 버튼을 누른 채 링커를 끌어 보세요', until: 'grab' },
    carry: { pic: touch ? finger('drag') : mouse('left', 'drag'), text: '○ 섬 위에서 놓아 주세요', until: 'drop' },
    throw: { pic: touch ? finger('flick') : mouse('left', 'flick'), text: '휙 던져서 보내도 돼요', until: 'throw' },
    turn: { pic: touch ? finger('drag') : mouse('right', 'drag'), text: touch ? '빈 곳을 끌면 시점이 돌아가요' : '오른쪽 버튼을 누른 채 끌면 시점이 돌아가요', until: 'turn' },
    zoom: { pic: touch ? finger('pinch') : mouse('wheel'), text: touch ? '두 손가락으로 벌리면 가까이 보여요' : '휠로 가까이 볼 수 있어요', until: 'zoom' },
  };
  CUES.tray = { pic: touch ? finger('drag') : mouse('left', 'drag'), text: '아래 도구를 끌어다 초원에 놓아 보세요', until: 'toy' };
  CUES.friends = { pic: touch ? finger('drag') : mouse('left', 'drag'), text: '「링커」를 끌어오면 친구가 늘어나요', until: 'add' };
  const PLAN = { 0: ['tray', 'friends'], 1: ['grab', 'carry', 'throw'], 2: ['turn', 'zoom'] };
  const PLAYING = !new URLSearchParams(location.search).has('level');
  if (PLAYING) document.body.classList.add('play');
  $(PLAYING ? 'modePlay' : 'modeSort').setAttribute('aria-current', 'page');
  let plan = [], current = null, shownAt = 0;
  const showCue = (name) => {
    current = name;
    shownAt = performance.now();
    if (!name) { $('cue').classList.remove('on'); return; }
    $('cuePic').innerHTML = CUES[name].pic;
    $('cueText').textContent = CUES[name].text;
    $('cue').classList.add('on');
  };
  const nextCue = () => showCue(plan.shift() || null);

  start($('stage'), {
    level(n, all, hint) {
      if (n === 0) {
        $('stageNo').textContent = '';
        $('count').textContent = '놀이터';
        plan = [...PLAN[0]];
        setTimeout(nextCue, 1200);
        return;
      }
      document.title = '초원 섬 · 링커 나누기';
      $('stageNo').textContent = `STAGE ${n}`;
      $('hint').textContent = hint;
      $('next').textContent = n < all ? '다음 단계' : '처음부터';
      $('next').onclick = () => { location.search = `?level=${n < all ? n + 1 : 1}`; };
      plan = [...(PLAN[n] || [])];
      setTimeout(nextCue, n === 1 ? 900 : 1600);
    },
    count(n, all) { $('count').textContent = `${n} / ${all}`; },
    event(what, d) {
      if (!current) return;
      const done = CUES[current].until;
      // (A throw counts for the throw's cue; any let-go for the carry's; the first let-go that was not a throw
      // keeps the throw's cue coming, one that was a throw skips it.)
      if (what === 'drop' && current === 'carry') {
        if (d.thrown) plan = plan.filter((c) => c !== 'throw');
        nextCue();
      } else if (what === 'drop' && current === 'throw' && d.thrown) {
        nextCue();
      } else if (what === done) {
        nextCue();
      }
    },
    done(n, all) {
      showCue(null);
      $('doneText').textContent = n < all ? '모두 제자리를 찾았어요. 섬에 꽃이 피었어요!' : '모든 단계를 마쳤어요. 초원에 꽃이 가득해요!';
      setTimeout(() => $('done').classList.add('on'), 900);
    },
    again() {},
    // The playground's tray: press a tool and drag it out (or press and let go, or Enter: somewhere on the island).
    play(api) {
      const tray = $('tray');
      tray.hidden = false;
      for (const b of tray.querySelectorAll('button')) {
        b.addEventListener('pointerdown', (e) => {
          if (b.disabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
          e.preventDefault();
          api.take(b.dataset.tool, e);
        });
        b.addEventListener('click', (e) => { if (e.detail === 0) api.drop(b.dataset.tool); });
      }
    },
    linkers(n, max) {
      const b = document.querySelector('[data-tool="linker"]');
      b.disabled = n >= max;
      b.title = n >= max ? `링커는 ${max}명까지예요` : '';
    },
  }).catch((e) => { document.body.dataset.error = e.message; console.error(e); });
</script>
</body>
</html>
